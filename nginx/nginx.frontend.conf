events {}

http {
    upstream azuredrop_api {
        server 172.16.1.4:3001;
    }

    upstream azuredrop_frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # Forward /api/ requests to the backend API.
        # The trailing slash removes the /api/ prefix.
        location /api/ {
            proxy_pass http://azuredrop_api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve the React frontend for all other paths.
        location / {
            proxy_pass http://azuredrop_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
