events {}

http {
    upstream azuredrop_api {
        server api:3000;
    }

    upstream azuredrop_frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # API: /api/files/1 is sent to the backend as /files/1
        location /api/ {
            proxy_pass http://azuredrop_api/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else is the React app
        location / {
            proxy_pass http://azuredrop_frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
