services:
  api:
    build:
      context: ./backend
    container_name: azuredrop-api
    env_file:
      - ./backend/.env
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - azuredrop-network

  frontend:
    build:
      context: ./frontend
    container_name: azuredrop-frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - azuredrop-network

  nginx:
    image: nginx:alpine
    container_name: azuredrop-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    networks:
      - azuredrop-network

networks:
  azuredrop-network:
    driver: bridge
